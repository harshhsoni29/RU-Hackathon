<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fly Poker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/ui/styles.css" />
  <link rel="stylesheet" href="./src/ui/betting.css" />
  <link rel="stylesheet" href="./src/ui/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="boot">Loading the poker room…</div>
  <script type="module" src="./src/main.js"></script>
  <script type="module">
    import { initBetting } from './src/ui/betting.js';
    // Exposed on window so main.js can call window.flyBetting.selectSeat(n) when a fly is clicked.
    window.flyBetting = initBetting({
      apiBase: 'http://127.0.0.1:8000',
      playerNames: ['Fly 1', 'Fly 2', 'Fly 3', 'Fly 4', 'Fly 5', 'Fly 6'], // match your scene's flies
    });
  </script>
</body>
</html>
